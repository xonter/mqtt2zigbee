name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: default
            dir: build
            sdk: ""
            suffix: ""
          - variant: geek
            dir: build_geek
            sdk: -D SDKCONFIG=sdkconfig.geek -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.geek"
            suffix: -geek
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32c6
          path: .
          command: idf.py -B ${{ matrix.dir }} ${{ matrix.sdk }} build

      - name: Create merged flash image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32c6
          path: .
          command: idf.py -B ${{ matrix.dir }} ${{ matrix.sdk }} merge-bin -o mqtt2zigbee${{ matrix.suffix }}-merged.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: |
            ${{ matrix.dir }}/mqtt2zigbee.bin
            ${{ matrix.dir }}/mqtt2zigbee${{ matrix.suffix }}-merged.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: fw
      - name: Rename for release
        run: |
          ls -R fw
          v="${GITHUB_REF_NAME}"
          cp fw/firmware-default/mqtt2zigbee.bin "mqtt2zigbee-${v}-app.bin"
          cp fw/firmware-default/mqtt2zigbee-merged.bin "mqtt2zigbee-${v}-merged.bin"
          cp fw/firmware-geek/mqtt2zigbee.bin "mqtt2zigbee-${v}-geek-app.bin"
          cp fw/firmware-geek/mqtt2zigbee-geek-merged.bin "mqtt2zigbee-${v}-geek-merged.bin"
          sha256sum mqtt2zigbee-${v}-*.bin > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mqtt2zigbee-*.bin
            SHA256SUMS
