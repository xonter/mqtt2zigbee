name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for tabs/CRLF/trailing whitespace in own sources
        run: |
          ! git grep -n -I -P '\r$' -- 'main' 'components/*' ':!components/esp-zigbee-lib' ':!components/web_ui/frontend'

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Status screen renderer tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined \
              -o /tmp/test_render components/status_screen/host_test/test_render.c \
              components/status_screen/screen_render.c -lm
          cd components/status_screen/host_test && /tmp/test_render
